<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loopwise Ticket Review</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  --ink: #1B1F1E; --ink-dim: #5B655F; --paper: #F4F5F1; --surface: #FFFFFF;
  --brand: #1E5B52; --brand-soft: #DCEAE6; --ready: #2F9E44; --ready-soft: #E3F3E4;
  --needs: #C67C1E; --needs-soft: #FBEBD6; --line: #DEDFD9; --focus: #1E5B52;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ink: #E9EBE6; --ink-dim: #9BA69F; --paper: #101413; --surface: #171C1A;
    --brand: #4FBBA8; --brand-soft: #163330; --ready: #4CC26B; --ready-soft: #123420;
    --needs: #E3A24A; --needs-soft: #3A2B12; --line: #262B29; --focus: #4FBBA8;
  }
}
:root[data-theme="dark"] {
  --ink: #E9EBE6; --ink-dim: #9BA69F; --paper: #101413; --surface: #171C1A;
  --brand: #4FBBA8; --brand-soft: #163330; --ready: #4CC26B; --ready-soft: #123420;
  --needs: #E3A24A; --needs-soft: #3A2B12; --line: #262B29; --focus: #4FBBA8;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 15px/1.55 "IBM Plex Sans", system-ui, sans-serif;
}
.mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
a { color: inherit; }

.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 22px; border-bottom: 1px solid var(--line); background: var(--surface);
}
.mark { width: 26px; height: 26px; border-radius: 7px; background: var(--brand);
  display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; flex: none; }
.topbar h1 { font-size: 16px; font-weight: 600; margin: 0; }
.topbar .sub { color: var(--ink-dim); font-size: 13px; }
.stats { margin-left: auto; display: flex; gap: 18px; }
.stat { text-align: right; }
.stat .n { font-family: "IBM Plex Mono"; font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat .l { font-size: 11px; color: var(--ink-dim); text-transform: uppercase; letter-spacing: .06em; }
.stat.needs .n { color: var(--needs); }
.stat.ready .n { color: var(--ready); }

.layout { display: grid; grid-template-columns: 340px 1fr; height: calc(100vh - 58px); }
@media (max-width: 860px) { .layout { grid-template-columns: 1fr; height: auto; } }

.queue { border-right: 1px solid var(--line); overflow-y: auto; background: var(--surface); }
.qgroup-label { padding: 14px 16px 6px; font-size: 11px; text-transform: uppercase;
  letter-spacing: .07em; color: var(--ink-dim); }
.qitem { display: block; width: 100%; text-align: left; padding: 11px 16px; border: none;
  background: none; border-bottom: 1px solid var(--line); cursor: pointer; color: var(--ink); }
.qitem:hover, .qitem.active { background: var(--brand-soft); }
.qitem .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.qitem .id { font-family: "IBM Plex Mono"; font-size: 11px; color: var(--ink-dim); }
.qitem .subj { font-weight: 500; margin-top: 2px; font-size: 13.5px; }
.pill { font-size: 10.5px; padding: 2px 7px; border-radius: 100px; font-weight: 500;
  text-transform: uppercase; letter-spacing: .04em; flex: none; }
.pill.needs { background: var(--needs-soft); color: var(--needs); }
.pill.ready { background: var(--ready-soft); color: var(--ready); }

.detail { overflow-y: auto; padding: 26px 32px 60px; }
.detail-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
.detail-head h2 { font-size: 19px; margin: 0; }
.detail .ticket-id { color: var(--ink-dim); font-size: 13px; margin-bottom: 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 16px 18px; margin-bottom: 16px; }
.card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--ink-dim); margin: 0 0 10px; }
.msg { white-space: pre-wrap; font-size: 14px; }
.why { background: var(--needs-soft); border: 1px solid color-mix(in srgb, var(--needs) 35%, var(--line));
  border-radius: 10px; padding: 14px 18px; margin-bottom: 16px; }
.why h3 { color: var(--needs); margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.trail { display: flex; flex-direction: column; gap: 0; }
.step { display: grid; grid-template-columns: 22px 1fr; gap: 12px; padding-bottom: 16px; position: relative; }
.step:not(:last-child)::before { content: ""; position: absolute; left: 10px; top: 22px; bottom: -2px;
  width: 1px; background: var(--line); }
.dot { width: 21px; height: 21px; border-radius: 50%; background: var(--brand-soft); color: var(--brand);
  display: grid; place-items: center; font-size: 11px; font-weight: 700; font-family: "IBM Plex Mono"; }
.step h4 { margin: 0 0 4px; font-size: 13.5px; }
.step p { margin: 0; font-size: 13.5px; color: var(--ink-dim); }
.badge { font-size: 11px; padding: 1px 7px; border-radius: 100px; margin-left: 6px;
  font-family: "IBM Plex Mono"; }
.badge.high { background: var(--ready-soft); color: var(--ready); }
.badge.medium { background: var(--needs-soft); color: var(--needs); }
.badge.low { background: var(--needs-soft); color: var(--needs); }
.cite { font-family: "IBM Plex Mono"; font-size: 12px; background: var(--brand-soft); color: var(--brand);
  padding: 2px 7px; border-radius: 5px; display: inline-block; margin: 2px 4px 2px 0; }
.compare { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 700px) { .compare { grid-template-columns: 1fr; } }
.empty { padding: 60px 20px; text-align: center; color: var(--ink-dim); }
</style>
</head>

<script id="ticket-data" type="application/json">[{"id": "T05", "subject": "Refund please", "body": "I upgraded to the Team plan 5 days ago and changed my mind. Can I get a full refund?", "gold_must_escalate": true, "baseline_reply": "Hi there,\n\nThanks for reaching out, and sorry to hear the Team plan didn't end up being the right fit.\n\nSince you're within 5 days of upgrading, you're well within our refund window \u2014 I'm happy to process a full refund for you. Could you confirm the email address associated with your Loopwise account (or your account/workspace name) so I can locate the subscription and process this right away?\n\nOnce confirmed, the refund will be issued to your original payment method and should appear within 5-10 business days, depending on your bank or card provider.\n\nLet me know if there's anything about the Team plan that fell short \u2014 we're always looking to improve, and your feedback would be genuinely helpful.\n\nBest regards,\nLoopwise Support", "status": "needs_review", "classification": {"category": "refund_request", "needs_human_approval": true, "confidence": "high", "reason": "This is a direct refund request, which per policy is only ever executed by a human manager, never an agent."}, "verification": {"passed": true, "final_needs_human_approval": true, "problems": [], "notes": "Both citations are accurate and directly support the reply's claims; the reply correctly states 14-day eligibility without approving or promising the refund, deferring execution to a manager as policy requires, and maintains a professional tone."}, "redraft_attempts": 1, "reply": "Hi,\n\nThanks for reaching out, and sorry to hear the Team plan wasn't the right fit.\n\nUnder our refund policy, requests made within 14 calendar days of the charge date are eligible for a full refund. Since you upgraded 5 days ago, your request falls within that window.\n\nI'm not able to process refunds directly \u2014 that has to be reviewed and completed by one of our support managers through the billing system. I've flagged your request for their review, and they'll follow up with you on the outcome.\n\nThanks for your patience in the meantime.\n\nBest,\nLoopwise Support", "citations": ["refund_policy.md item 1: 'Full refunds are available if requested within 14 calendar days of the charge date, for any reason.' \u2014 supports eligibility statement based on the 5-day-old charge.", "refund_policy.md item 6: 'A support agent (human or automated) may confirm the policy and check the charge date, but must never promise a refund amount or approve a refund outright. Refunds are only executed by a manager through the billing system.' \u2014 supports framing the refund as pending manager review/execution rather than approved or guaranteed."]}, {"id": "T06", "subject": "Want my money back", "body": "I was charged for the annual plan 20 days ago and I want a refund, I haven't used the product much.", "gold_must_escalate": true, "baseline_reply": "Hi there,\n\nThank you for reaching out, and I'm sorry to hear the annual plan hasn't been the right fit for you.\n\nSince your charge was made within the last 20 days, you're well within our refund window, so I'd be happy to process a full refund for you. To get this started, could you please confirm the following:\n\n1. The email address associated with your Loopwise account (if different from this one)\n2. Whether you'd like the account closed, or downgraded to our free plan instead\n\nOnce I have that confirmation, I'll process the refund right away. Please allow 5-10 business days for the funds to appear back on your original payment method, depending on your bank.\n\nIf there was anything specific about the product that didn't meet your expectations, I'd also love to hear it -- your feedback helps us improve, and if it's something we can quickly resolve, we'd welcome the chance to keep you as a customer.\n\nThanks again for your patience, and I'll take care of this as soon as I hear back from you.\n\nBest regards,\nLoopwise Support", "status": "needs_review", "classification": {"category": "refund_request", "needs_human_approval": true, "confidence": "high", "reason": "The customer is explicitly requesting a refund, which per policy must always be escalated to a human manager."}, "verification": {"passed": true, "final_needs_human_approval": true, "problems": [], "notes": "All citations are accurate and support the reply's claims; the reply correctly explains policy without promising/approving a refund and appropriately escalates to a manager, consistent with the classifier's needs_human_approval=True."}, "redraft_attempts": 0, "reply": "Hi,\n\nThank you for reaching out, and I'm sorry to hear the annual plan hasn't worked out for you so far.\n\nI checked our refund policy: standard refunds are available for charges made within 14 calendar days. Since your annual plan charge was made 20 days ago, it falls outside that window, so it isn't eligible for a standard refund under our normal policy. I also want to note that for annual plans, this 14-day window is based on the charge date itself, and we're not able to offer partial or prorated refunds for unused time outside that window.\n\nThat said, requests like yours can be reviewed as a goodwill exception, and that decision has to be made by a support manager rather than by me. I'm escalating your request to a manager now so they can take a closer look at your account and get back to you with a decision.\n\nThanks for your patience while this is being reviewed.\n\nBest,\nLoopwise Support", "citations": ["data/kb/refund_policy.md #1 - Full refunds available within 14 calendar days of the charge date", "data/kb/refund_policy.md #2 - Requests made after 14 days are not eligible for standard refund; may only be approved as a goodwill exception by a manager, never a first-line agent or automated system", "data/kb/refund_policy.md #3 - For annual plans, the 14-day window applies to the annual charge date, and there are no partial/prorated refunds for unused months outside that window", "data/kb/refund_policy.md #6 - Agent may confirm policy and check charge date but must never promise or approve a refund; only a manager executes refunds"]}, {"id": "T07", "subject": "Can't log in, no reset email", "body": "I clicked 'forgot password' three times and never received a reset email. I'm locked out of my workspace and my team has a deadline today.", "gold_must_escalate": true, "baseline_reply": "Hi there,\n\nI'm sorry for the trouble, especially with a deadline today \u2014 let's get this sorted quickly.\n\nA few things to check first:\n1. Please check your spam/junk folder for an email from noreply@loopwise.com.\n2. If you have an email filter or forwarding rule set up, confirm it isn't routing our messages elsewhere.\n3. Double-check that you're entering the exact email address associated with your Loopwise account (if you have multiple accounts or use SSO, the reset flow won't send an email).\n\nIf none of those explain it, reply to this message with the email address and workspace name you're trying to access, and I'll investigate on our end and manually trigger a reset or unlock your account directly. Given your deadline, I'll prioritize this and get back to you as soon as possible.\n\nThanks for your patience.\n\nBest,\nLoopwise Support", "status": "needs_review", "classification": {"category": "account_access", "needs_human_approval": true, "confidence": "low", "reason": "The KB has no documented guidance on missing password-reset emails or login lockouts, so this core issue isn't clearly covered and should be routed to a human."}, "verification": {"passed": true, "final_needs_human_approval": true, "problems": [], "notes": "No KB coverage exists for password-reset/lockout issues, confirming the citation note is accurate; the reply makes no unsupported policy claims, promises no refund/discount/account action, and is professionally toned, so the classifier's needs_human_approval=True stands unchanged."}, "redraft_attempts": 0, "reply": "Hi,\n\nThanks for reaching out, and sorry for the trouble \u2014 I know being locked out with a deadline today is stressful.\n\nI've flagged your account for a member of our support team to look into directly, since getting your password reset email delivered and your workspace access restored requires a manual check on our end. You'll hear from someone shortly.\n\nIn the meantime, if you have a teammate with admin access to the workspace, they may be able to help unblock you or reassign anything time-sensitive while we sort out your login.\n\nWe'll be in touch as soon as possible.\n\nBest,\nLoopwise Support", "citations": ["No KB citation applicable \u2014 data/kb/product_faq.md, data/kb/billing_faq.md, data/kb/refund_policy.md, and data/kb/known_issues.md contain no guidance on password-reset email delivery or account lockouts, consistent with the ticket's needs_human_approval classification. The reply contains no factual or policy claims and only acknowledges the issue and sets expectations for human follow-up."]}, {"id": "T09", "subject": "Refund or I'm disputing this charge", "body": "Your own policy says refunds are available anytime. I was charged 40 days ago and I want a full refund immediately or I'm filing a chargeback with my bank.", "gold_must_escalate": true, "baseline_reply": "Hi,\n\nThank you for reaching out, and I'm sorry for the frustration this has caused.\n\nI want to look into your refund request properly rather than give you a generic answer, so could you send me the email address or account name on the subscription and the approximate date/amount of the charge in question? Once I have those details, I'll pull up your account and confirm exactly what applies to your situation.\n\nI'd also genuinely prefer to resolve this directly with you rather than have you go through a chargeback, since that process is slower and more limited than what we can typically offer here. If a refund is due, I want to get that processed for you as quickly as possible.\n\nI'll follow up as soon as I've reviewed your account details. Thanks for your patience in the meantime.\n\nBest regards,\nLoopwise Support", "status": "needs_review", "classification": {"category": "refund_request", "needs_human_approval": true, "confidence": "high", "reason": "Customer is requesting a refund (charged 40 days ago, outside the 14-day window) and explicitly threatens a chargeback, both of which require mandatory human/manager escalation per refund_policy.md."}, "verification": {"passed": true, "final_needs_human_approval": true, "problems": [], "notes": "All four citations accurately reflect refund_policy.md points 1, 2, 5, and 6; the reply correctly states the 14-day window, declines to promise/execute a refund, and escalates the chargeback threat to a manager, consistent with the classifier's needs_human_approval=True."}, "redraft_attempts": 0, "reply": "Hi,\n\nThanks for reaching out, and I'm sorry for the frustration around this charge.\n\nI want to clarify our refund policy, since it works a bit differently than described: full refunds are available for requests made within 14 calendar days of the charge date. Requests made after that 14-day window aren't eligible for a standard refund \u2014 those can only be approved as a goodwill exception, and that decision has to be made by a support manager rather than a first-line agent.\n\nSince your charge was 40 days ago, it falls outside the standard refund window. However, because you've also raised the possibility of a chargeback, I'm escalating this ticket directly to a manager for review right away \u2014 this is handled as a priority regardless of the 14-day window. I'm not able to approve or process a refund myself, but a manager will follow up with you directly on next steps.\n\nThanks for your patience while this gets reviewed.\n\nBest,\nLoopwise Support", "citations": ["data/kb/refund_policy.md (point 1) \u2014 full refunds available only within 14 calendar days of charge date", "data/kb/refund_policy.md (point 2) \u2014 requests after 14 days are not eligible for standard refund; only approvable as a manager goodwill exception, never by first-line agent", "data/kb/refund_policy.md (point 5) \u2014 chargeback threats must be escalated to a human immediately regardless of the 14-day window", "data/kb/refund_policy.md (point 6) \u2014 agent may confirm policy/check charge date but must never promise or execute a refund"]}, {"id": "T10", "subject": "Charged the exact same amount twice today", "body": "I just checked my card and I was charged $45.00 twice today, same amount, same day, for my Loopwise Team plan.", "gold_must_escalate": true, "baseline_reply": "Hi there,\n\nThanks for flagging this, and sorry for the trouble \u2014 I know a duplicate charge is frustrating to spot.\n\nI'd like to look into your account right away to confirm what happened and get this corrected. Could you reply with the email address on your Loopwise account (if different from this one) and, if you have them handy, the last 4 digits of the card that was charged? That will help me locate both transactions quickly.\n\nIn the meantime, rest assured that if we confirm a duplicate charge, we'll refund the extra $45.00 to your original payment method \u2014 no need to dispute it with your bank in the meantime.\n\nI'll follow up as soon as I've had a chance to review your billing history.\n\nBest,\nLoopwise Support", "status": "needs_review", "classification": {"category": "billing_question", "needs_human_approval": true, "confidence": "high", "reason": "The KB explicitly states that two identical charges on the same day is a billing error that must be escalated rather than resolved by the agent."}, "verification": {"passed": true, "final_needs_human_approval": true, "problems": [], "notes": "Both citations are accurate and directly support the claims; reply correctly escalates without promising any refund/discount, and professional tone is maintained."}, "redraft_attempts": 0, "reply": "Hi,\n\nThanks for flagging this, and I'm sorry for the trouble. Two charges of the exact same amount on the exact same day is not expected behavior for your Team plan billing, and it's not something I'm able to resolve directly from here \u2014 I've escalated your case to our billing team so they can investigate the duplicate charge and take the appropriate action on your account.\n\nIn the meantime, you can view both charges under Settings > Billing > Invoices to confirm the details (dates, amounts, and line items) \u2014 that record will help our billing team look into this faster.\n\nYou'll hear from us as soon as we have an update. Thanks for your patience.\n\nBest,\nLoopwise Support", "citations": ["data/kb/billing_faq.md: \"If the two charges are for the exact same amount on the exact same day, that is a billing error and should be escalated, not resolved by the agent.\" (Q: I was charged twice this month, what happened?)", "data/kb/billing_faq.md: \"Settings > Billing > Invoices \u2014 each charge should correspond to a separate line item\" (Q: I was charged twice this month, what happened? / Q: How do I get an invoice/receipt?)"]}, {"id": "T01", "subject": "Charged twice this month?", "body": "Hi, I noticed two separate charges on my card this month from Loopwise, one for $135 and one for $27. Is this a mistake?", "gold_must_escalate": false, "baseline_reply": "Hi there,\n\nThanks for reaching out, and sorry for the confusion around these charges. Two separate amounts like $135 and $27 in the same month usually happen for one of these reasons:\n\n- A plan upgrade or add-on purchased partway through your billing cycle, which is prorated and billed separately from your regular subscription charge.\n- An additional seat or workspace added to your account.\n- Your regular subscription renewal plus a one-time charge (e.g., extra storage or a paid add-on).\n\nI'd like to look into your account directly to confirm exactly what each charge corresponds to. Could you reply with the email address or workspace name associated with your Loopwise account (if different from this one), and the last 4 digits of the card charged? That will let me pull up your billing history and confirm the details.\n\nIf it turns out this was billed in error, we'll issue a refund right away.\n\nLooking forward to hearing back so I can get this sorted for you.\n\nBest,\nLoopwise Support", "status": "ready", "classification": {"category": "billing_question", "needs_human_approval": false, "confidence": "high", "reason": "The two charges are different amounts, matching the KB's documented explanation for mid-cycle proration plus renewal, and the customer is only asking for clarification, not alleging fraud or requesting a refund."}, "verification": {"passed": true, "final_needs_human_approval": false, "problems": [], "notes": "Both citations are accurate and directly support the reply's claims; the reply only explains documented policy (proration/renewal explanation, where to check invoices, escalation path for genuine duplicates) without promising any refund or account action, and the tone is professional."}, "redraft_attempts": 0, "reply": "Hi,\n\nThanks for reaching out about this. Two separate charges in the same month usually happen when your workspace's member count crosses a plan threshold partway through your billing cycle. In that case, you'd see a prorated charge for the added member(s) covering the rest of the current cycle, in addition to your regular renewal charge \u2014 so the two amounts ($135 and $27) would reflect different line items rather than a duplicate charge.\n\nTo confirm this is what happened, you can check Settings > Billing > Invoices, where each charge should appear as a separate line item with its own description. If you review it there and the two charges turn out to be for the exact same amount on the exact same day, that would indicate a billing error, and we'd want to look into it further \u2014 just let us know and we'll escalate it.\n\nLet us know what you find, or if you have any other questions!\n\nBest,\nLoopwise Support", "citations": ["data/kb/billing_faq.md \u2014 'Q: I was charged twice this month, what happened?' (explains proration + renewal as the typical cause of two differing charges, where to verify via Invoices, and that identical same-day/same-amount charges indicate a billing error requiring escalation)", "data/kb/billing_faq.md \u2014 'Q: How do I get an invoice/receipt?' (Settings > Billing > Invoices location for checking charge line items)"]}, {"id": "T02", "subject": "Inviting a coworker", "body": "How do I add my coworker to our Loopwise workspace as an editor?", "gold_must_escalate": false, "baseline_reply": "Hi there,\n\nThanks for reaching out! Here's how to add a coworker to your workspace as an Editor:\n\n1. Log in to Loopwise and open your workspace.\n2. Click your workspace name in the top-left corner, then select \"Members\" (or \"Workspace Settings\" > \"Members,\" depending on your plan).\n3. Click \"Invite Member.\"\n4. Enter your coworker's email address.\n5. In the role dropdown, select \"Editor.\"\n6. Click \"Send Invite.\"\n\nYour coworker will receive an email invitation. Once they accept and create or log into their account, they'll have Editor access to your workspace.\n\nNote: only workspace Owners and Admins can invite new members, so if you don't see the \"Invite Member\" option, you may need to ask your workspace admin to add them or grant you the necessary permissions.\n\nLet me know if you run into any issues or have other questions!\n\nBest,\nLoopwise Support", "status": "ready", "classification": {"category": "how_to", "needs_human_approval": false, "confidence": "high", "reason": "The product FAQ directly explains how to invite a teammate as an Editor via Settings > Members > Invite, with no refund, fraud, or policy-exception concerns present."}, "verification": {"passed": true, "final_needs_human_approval": false, "problems": [], "notes": "Citation to product_faq.md accurately supports all claims (invite steps, Editor role, 7-day expiration); no unsupported commitments; tone is professional."}, "redraft_attempts": 0, "reply": "Hi,\n\nThanks for reaching out! Adding a coworker as an Editor is quick to set up.\n\n1. Go to Settings > Members > Invite.\n2. Enter your coworker's email address.\n3. Choose \"Editor\" as their role.\n\nThey'll receive an email invitation, so just let them know to check their inbox. Note that the invite link expires after 7 days, so if they don't accept it in that window, you'll need to send a new one.\n\nLet us know if you run into any issues or have other questions!\n\nBest,\nLoopwise Support", "citations": ["data/kb/product_faq.md \u2014 'Q: How do I invite a teammate?' (Settings > Members > Invite, role selection including Editor, 7-day invite expiration)"]}, {"id": "T03", "subject": "CSV export missing assignees", "body": "When I export my board to CSV, some tasks that have two assignees only show one, or none at all. Is this a known bug?", "gold_must_escalate": false, "baseline_reply": "Hi there,\n\nThanks for flagging this, and sorry for the trouble it's causing with your exports.\n\nThis isn't a known, confirmed bug on our end yet, but what you're describing \u2014 tasks with multiple assignees showing only one or none in the CSV \u2014 points to an issue with how multi-assignee fields are being flattened into a single CSV column. I'd like to get this properly investigated.\n\nTo help our team track it down, could you share a few details:\n- Roughly how many tasks on the board have two (or more) assignees, and does the issue affect all of them or just some?\n- Are the missing assignees consistently the same person (e.g., always the second one added), or does it vary?\n- Which browser and, if you know it, which CSV viewer you're opening the file in (Excel, Google Sheets, Numbers, etc.) \u2014 sometimes the data is present but rendered oddly by the viewer.\n\nIf you're able to export a small sample board (even a couple of test tasks with multiple assignees) and send over the resulting CSV file, that would help us reproduce it quickly.\n\nIn the meantime, as a workaround, checking the task details in-app for the full assignee list is the most reliable way to confirm who's assigned until we resolve the export issue.\n\nI'll keep this ticket open and update you as soon as we have more information.\n\nThanks for your patience,\nLoopwise Support", "status": "ready", "classification": {"category": "bug_report", "needs_human_approval": false, "confidence": "high", "reason": "This is a documented known issue (KI-101: CSV export omits Assignee column for multi-assignee tasks, workaround is JSON export) with no refund, fraud, or discretionary-exception element."}, "verification": {"passed": true, "final_needs_human_approval": false, "problems": [], "notes": "Citation KI-101 exists and accurately supports the reply's claims; no unsupported commitments or refund/discount actions; tone is professional."}, "redraft_attempts": 0, "reply": "Hi,\n\nThanks for reaching out, and yes \u2014 this is a known issue. When a task has more than one assignee, the CSV export can omit the \"Assignee\" column for that task entirely. Our team is aware of it and a fix is expected in an upcoming release.\n\nIn the meantime, the recommended workaround is to use the JSON export instead, which correctly includes all assignees for multi-assignee tasks.\n\nSorry for the inconvenience this has caused, and thank you for flagging it. Let us know if you run into anything else.\n\nBest,\nLoopwise Support", "citations": ["data/kb/known_issues.md \u2014 KI-101: \"CSV export occasionally omits the 'Assignee' column when a task has more than one assignee. Fix expected in the next release. Workaround: use JSON export instead.\""]}, {"id": "T04", "subject": "Dark mode?", "body": "Any plans to add a dark mode to Loopwise? My eyes would appreciate it.", "gold_must_escalate": false, "baseline_reply": "Hi there,\n\nThanks for reaching out, and I completely understand the request \u2014 a lot of our users have asked for the same thing!\n\nDark mode isn't available in Loopwise just yet, but it's on our radar as a frequently requested feature. I don't have a specific release date to share right now, but I've added your voice to the request so our product team can factor it into prioritization.\n\nIn the meantime, if you're using a browser extension or OS-level dark mode setting, some users have found that helps reduce eye strain when using Loopwise, though it won't be a perfect match for the interface.\n\nI'll make sure to follow up with you if this ships or if we have more details to share. Thanks again for the feedback \u2014 it genuinely helps us shape the roadmap!\n\nBest,\nLoopwise Support", "status": "ready", "classification": {"category": "feature_request", "needs_human_approval": false, "confidence": "high", "reason": "This is a simple feature request for dark mode with no refund, fraud, discount, or policy-exception elements, so it can be handled without human approval."}, "verification": {"passed": true, "final_needs_human_approval": false, "problems": [], "notes": "No KB entries exist on dark mode/theming, and the draft correctly avoids fabricating any citation or policy claim while making no refund/discount/account commitments; tone is professional, so it passes with no override needed."}, "redraft_attempts": 0, "reply": "Hi,\n\nThanks for reaching out, and for the kind suggestion! Dark mode isn't something we currently have listed in our product documentation, so I don't have a timeline to share on if or when it might be added.\n\nI've made a note of your interest so it's on record. In the meantime, if eye strain is the main concern, you're welcome to use your browser's or operating system's built-in dark/night mode, which will apply a dark theme over Loopwise's interface as a workaround.\n\nThanks again for the feedback \u2014 it genuinely helps us understand what our customers want to see next.\n\nBest,\nLoopwise Support", "citations": ["No KB entry found in data/kb/product_faq.md, data/kb/known_issues.md, data/kb/billing_faq.md, or data/kb/refund_policy.md regarding dark mode, UI theming, or a feature-request/roadmap process. No factual or policy claims in this reply are drawn from the KB; the reply avoids stating any unverified facts (e.g., no promise that the request is formally logged in a tracking system, no roadmap commitment)."]}, {"id": "T08", "subject": "Question about annual discount", "body": "I saw I was charged the full annual amount up front. I'm not asking for a refund, I just want to understand -- is that the plan with the 20% discount, or is the discount something else?", "gold_must_escalate": false, "baseline_reply": "Hi there,\n\nThanks for reaching out, and great question!\n\nYes, when you're billed the full annual amount up front, that charge already includes the 20% discount compared to paying monthly. In other words, the annual plan price you were charged is 20% lower than what you'd pay if you were billed monthly for 12 months -- the discount is baked into the annual rate rather than shown as a separate line item.\n\nIf you'd like, I'm happy to pull up your account and send over a breakdown showing the monthly-equivalent rate versus what you were charged, so you can see the savings clearly. Just let me know!\n\nBest,\nLoopwise Support", "status": "ready", "classification": {"category": "billing_question", "needs_human_approval": false, "confidence": "high", "reason": "The customer is only asking to confirm how the annual discount works (not requesting a refund or discretionary discount), and billing_faq.md clearly states annual billing gives a 20% discount versus monthly."}, "verification": {"passed": true, "final_needs_human_approval": false, "problems": [], "notes": "All four citations exist in billing_faq.md and accurately support the reply's claims (pricing, discount, charge timing, invoice location); the reply only explains documented policy with no refund/discount promise, and tone is professional, so the classifier's needs_human_approval=false stands."}, "redraft_attempts": 0, "reply": "Hi,\n\nThanks for reaching out, and glad to clarify this for you.\n\nYes, that's the same discount. For the Team plan, annual billing is $12/user/month (billed as one upfront annual charge), compared to $15/user/month when billed monthly -- that works out to the 20% discount for choosing annual billing. Being charged the full annual amount up front is expected behavior for that billing cycle: charges occur on the day you upgrade, then annually on that same calendar day going forward.\n\nYou can always double-check the breakdown for your workspace under Settings > Billing > Invoices, where each charge is itemized.\n\nLet me know if you have any other questions.\n\nBest,\nLoopwise Support", "citations": ["data/kb/billing_faq.md - \"Plans\" section: Team plan pricing ($15/user/month monthly vs $12/user/month annually)", "data/kb/billing_faq.md - \"Q: Do you offer discounts?\": confirms annual billing gives a 20% discount versus monthly", "data/kb/billing_faq.md - \"Q: When am I charged?\": confirms charges occur on upgrade day, then annually on that same calendar day", "data/kb/billing_faq.md - \"Q: How do I get an invoice/receipt?\": Settings > Billing > Invoices for itemized charges"]}, {"id": "T11", "subject": "Wrong timezone on mobile time entries", "body": "Some of my time tracking entries from the mobile app show the wrong timezone, like 5 hours off.", "gold_must_escalate": false, "baseline_reply": "Hi there,\n\nThanks for reaching out, and sorry for the confusion this has caused with your time entries.\n\nA 5-hour offset usually points to a timezone mismatch between your mobile device and your Loopwise account settings \u2014 this can happen if your phone's timezone was set differently at the time you logged the entry (for example, while traveling), or if your account's default timezone doesn't match your device's local timezone.\n\nCould you help me narrow this down by sharing the following?\n\n1. What timezone is currently set in your Loopwise account (Settings > Profile > Timezone)?\n2. What timezone is your mobile device set to?\n3. A couple of examples of affected entries (the time shown vs. the time you actually logged it), along with the dates.\n4. Which mobile app version and OS (iOS/Android) you're using.\n\nIn the meantime, if you notice this happening in real time, checking that your device's timezone (usually under Settings > General > Date & Time) is set to \"Set Automatically\" can sometimes resolve it going forward.\n\nOnce I have those details, I'll dig into your account and get this corrected.\n\nThanks for your patience!\n\nBest,\nLoopwise Support", "status": "ready", "classification": {"category": "bug_report", "needs_human_approval": false, "confidence": "high", "reason": "This matches known issue KI-120 (mobile timezone bug pre-4.2, with a documented workaround) and involves no refund, fraud accusation, or discretionary request."}, "verification": {"passed": true, "final_needs_human_approval": false, "problems": [], "notes": "Citation KI-120 is accurate and fully supports the claim; reply only relays the documented workaround with no promises or policy fabrication, so it passes as ready to send."}, "redraft_attempts": 0, "reply": "Hi,\n\nThanks for flagging this. What you're seeing is a known issue: time tracking entries submitted from the mobile app before app version 4.2 can show the wrong timezone.\n\nTo fix the affected entries, please re-submit them from the web app \u2014 this will correct the timezone. We'd also recommend updating to the latest mobile app version to prevent this from happening with future entries.\n\nSorry for the inconvenience, and let us know if you run into any trouble with the workaround.\n\nBest,\nLoopwise Support", "citations": ["data/kb/known_issues.md \u2014 KI-120: \"Time tracking entries submitted from the mobile app before app version 4.2 may show the wrong timezone. Workaround: re-submit the entry from the web app.\""]}, {"id": "T12", "subject": "Lost custom field data after moving tasks", "body": "I bulk-moved 20 tasks to a new board and now the custom 'Priority Score' field is empty on all of them. Did I lose that data?", "gold_must_escalate": false, "baseline_reply": "Hi there,\n\nThanks for reaching out, and sorry for the scare! In most cases, this data isn't actually lost \u2014 here's what's likely happening and how to check.\n\nWhen tasks are moved to a board that doesn't have a matching 'Priority Score' custom field configured, Loopwise hides the values on the task cards rather than deleting them. The underlying data typically remains attached to the tasks even though it isn't displayed.\n\nCould you confirm the following for me?\n\n1. Does the new board have a custom field named 'Priority Score' set up (Board Settings > Custom Fields)? If not, that's almost certainly why the values appear empty \u2014 adding a field with the same name and type should restore the display.\n2. What are the task IDs or URLs for a couple of the affected tasks? I can look at the task history/audit log on our end to confirm the values are still stored.\n\nIn the meantime, please avoid bulk-editing or clearing that field on these tasks, just to be safe while we confirm.\n\nI'll keep an eye out for your reply and get this sorted quickly.\n\nBest,\nLoopwise Support", "status": "ready", "classification": {"category": "bug_report", "needs_human_approval": false, "confidence": "high", "reason": "This is documented as KI-122 in known_issues.md: bulk-moving tasks drops custom field values if the destination board lacks a matching custom field, which is expected behavior, not data loss requiring escalation."}, "verification": {"passed": true, "final_needs_human_approval": false, "problems": [], "notes": "Citation to KI-122 is accurate and fully supports the reply's claims about bulk-move custom field behavior; reply makes no refund/discount/account-action promises and stays within documented policy, so it passes with no override to human approval."}, "redraft_attempts": 0, "reply": "Hi,\n\nThanks for reaching out, and sorry for the scare. What you're seeing is expected behavior tied to how bulk moves handle custom fields, not data loss on our end.\n\nWhen tasks are bulk-moved to a different board, any custom field (like your \"Priority Score\") will be cleared if the destination board doesn't have a matching custom field set up. This is a known, documented behavior rather than a bug.\n\nTo avoid this in the future, please confirm that the destination board has a matching custom field (same name/type) before doing a bulk move \u2014 that way the values carry over correctly.\n\nUnfortunately, since the field values were cleared during the move rather than stored elsewhere, we're not able to restore the original \"Priority Score\" values for the 20 tasks that were already moved. If you'd like, you can add a matching \"Priority Score\" custom field to the destination board going forward so future moves preserve this data.\n\nLet us know if you have any other questions.\n\nBest,\nLoopwise Support", "citations": ["data/kb/known_issues.md \u2014 KI-122: Bulk task move between boards can silently drop custom field values if the destination board doesn't have a matching custom field; documented as expected behavior, with the recommendation to confirm matching custom fields on the destination board before a bulk move."]}]</script>
<script>
const tickets = JSON.parse(document.getElementById('ticket-data').textContent);
const queueEl = document.getElementById('queue');
const detailEl = document.getElementById('detail');
let activeId = null;

function esc(s) { const d = document.createElement('div'); d.textContent = s ?? ''; return d.innerHTML; }

function renderQueue() {
  const needs = tickets.filter(t => t.status === 'needs_review');
  const ready = tickets.filter(t => t.status === 'ready');
  document.getElementById('stat-needs').textContent = needs.length;
  document.getElementById('stat-ready').textContent = ready.length;

  const group = (label, items) => {
    if (!items.length) return '';
    const rows = items.map(t => `
      <button class="qitem${t.id === activeId ? ' active' : ''}" data-id="${t.id}">
        <div class="top">
          <span class="id">${t.id}</span>
          <span class="pill ${t.status === 'needs_review' ? 'needs' : 'ready'}">${t.status === 'needs_review' ? 'Review' : 'Ready'}</span>
        </div>
        <div class="subj">${esc(t.subject)}</div>
      </button>`).join('');
    return `<div class="qgroup-label">${label} (${items.length})</div>${rows}`;
  };

  queueEl.innerHTML = group('Needs your review', needs) + group('Ready to send', ready);
  queueEl.querySelectorAll('.qitem').forEach(el => el.addEventListener('click', () => selectTicket(el.dataset.id)));
}

function renderDetail(t) {
  if (!t) { detailEl.innerHTML = '<div class="empty">Select a ticket from the queue.</div>'; return; }
  const cls = t.classification || {};
  const ver = t.verification || {};
  const confBadge = cls.confidence ? `<span class="badge ${cls.confidence}">${cls.confidence} confidence</span>` : '';
  const citesHtml = (t.citations || []).length
    ? t.citations.map(c => `<span class="cite">${esc(c)}</span>`).join('')
    : '<span style="color:var(--ink-dim);font-size:13px;">none needed</span>';

  const whyHtml = t.status === 'needs_review' ? `
    <div class="why">
      <h3>Why this needs you</h3>
      <p style="margin:0;font-size:13.5px;">${esc(cls.reason || ver.notes || 'Flagged for human review.')}</p>
    </div>` : '';

  const redraftNote = t.redraft_attempts > 0
    ? `<p>Verifier rejected the first draft and requested a redraft (${t.redraft_attempts} retry). Shown below is the corrected, passing version.</p>`
    : `<p>Passed verification on the first attempt.</p>`;

  const baselineCompare = t.baseline_reply ? `
    <div class="card">
      <h3>Baseline vs. agent reply</h3>
      <div class="compare">
        <div><div style="font-size:11px;color:var(--ink-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;">No-tools baseline</div><div class="msg">${esc(t.baseline_reply)}</div></div>
        <div><div style="font-size:11px;color:var(--ink-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;">Agent pipeline</div><div class="msg">${esc(t.reply)}</div></div>
      </div>
    </div>` : '';

  detailEl.innerHTML = `
    <div class="detail-head">
      <h2>${esc(t.subject)}</h2>
      <span class="pill ${t.status === 'needs_review' ? 'needs' : 'ready'}">${t.status === 'needs_review' ? 'Needs review' : 'Ready to send'}</span>
    </div>
    <div class="ticket-id mono">${t.id}</div>

    ${whyHtml}

    <div class="card">
      <h3>Customer message</h3>
      <div class="msg">${esc(t.body)}</div>
    </div>

    <div class="card">
      <h3>How the agent got here</h3>
      <div class="trail">
        <div class="step">
          <div class="dot">1</div>
          <div><h4>Classified as "${esc(cls.category || '—')}" ${confBadge}</h4><p>${esc(cls.reason || '')}</p></div>
        </div>
        <div class="step">
          <div class="dot">2</div>
          <div><h4>Drafted a reply</h4><p>${redraftNote} Citations: ${citesHtml}</p></div>
        </div>
        <div class="step">
          <div class="dot">3</div>
          <div><h4>Verified ${ver.passed ? '— passed' : '— failed, forced to review'}</h4><p>${esc(ver.notes || '')}</p></div>
        </div>
      </div>
    </div>

    <div class="card">
      <h3>Reply to send</h3>
      <div class="msg">${esc(t.reply)}</div>
    </div>

    ${baselineCompare}
  `;
}

function selectTicket(id) {
  activeId = id;
  renderQueue();
  renderDetail(tickets.find(t => t.id === id));
}

renderQueue();
if (tickets.length) selectTicket(tickets.filter(t => t.status === 'needs_review')[0]?.id || tickets[0].id);
else renderDetail(null);
</script>
</body>
</html>
